# Design contract only. Current scripts do not perform experiments.
experiment:
  status: design_only_pending_review
  seed: 42
  user_id: eval_test_user
  production_database_writes_allowed: false

backend:
  base_url: http://127.0.0.1:8080
  endpoint: /api/eval/memory/search
  api_status: proposed_not_implemented
  enabled: false
  token_env: MINDPET_EVAL_TOKEN
  timeout_seconds: 60

dataset:
  memories: datasets/retrieval/memories.jsonl
  queries: datasets/retrieval/queries.jsonl
  target_memory_count: 120
  target_query_count: 40
  generation_status: not_implemented
  timestamp_strategy: relative_to_recorded_anchor_time
  database_id_mapping: results/raw/memory_id_mapping.json
  import_status: not_implemented_not_authorized

retrieval:
  modes:
    - keyword_only
    - vector_only
    - rrf
    - mindpet_full
  request_top_k: 10
  metric_k: [1, 3, 5, 10]
  touch_accessed: false
  shared_retention_filter: preserve_current_sql
  # Facts to verify against Java, not tunable replacements for Java constants.
  source_contract:
    semantic_limit: 20
    keyword_sql_pool_limit: 100
    keyword_limit: 20
    rrf_k: 60
    retention_min: 0.1
    emotion_rerank: false
    direct_layer_rerank: false

outputs:
  raw_results: results/raw/retrieval_results.jsonl
  metrics_csv: results/tables/retrieval_metrics.csv
  figures_dir: results/figures
  overwrite_existing_run: false
  failure_policy: record_failure_do_not_fabricate_metrics
